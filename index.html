<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>Roamly — Discover Nearby</title>
<!-- Roamly — see README.md for setup, data sources and deployment -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/css/app.css">

</head>
<body>

<header class="top"><div class="wrap">
  <div class="logo"><i>◎</i><span>Roamly</span></div>
  <button class="loc" data-act="loc" aria-label="Change location"><b>📍</b><span id="locLabel">Locating…</span><small style="opacity:.5">▾</small></button>
  <nav class="topnav">
    <button data-tab="explore">Explore</button><button data-tab="map">Map</button><button data-tab="saved">Saved</button><button data-tab="profile">You</button>
  </nav>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Toggle dark mode">🌙</button>
</div></header>

<main class="wrap">
  <!-- ============ EXPLORE ============ -->
  <section class="view" id="v-explore">
    <div class="welcome compact" id="welcome">
      <div class="sky" id="sky" aria-hidden="true"></div>
      <div class="w-in">
        <div>
          <span class="w-pill" id="wPill"></span>
          <div class="w-kicker">Welcome to</div>
          <h1 class="w-city" id="wCity">Dubai</h1>
          <p class="w-sub" id="wSub"></p>
          <form class="search hero-search" id="searchForm" role="search">
            <span aria-hidden="true">🔎</span>
            <input id="q" type="search" placeholder="Try “rooftop bar” or “sushi”" autocomplete="off" aria-label="Search places">
            <button class="btn primary" type="submit">Search</button>
          </form>
        </div>
      </div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="actrow">
      <button class="bigbtn" data-act="plan"><b>🗓️</b><span><strong>Plan my day</strong><small>Pick a mood, get a ready-made day</small></span></button>
      <button class="sqbtn" data-act="surprise"><b>🎲</b>Surprise me</button>
    </div>
    <div class="fbar"><button class="fbtn" data-act="filters">⚙️ Filters <i id="fCount" hidden></i></button><button class="fsum" data-act="filters" id="fSum"></button></div>
    <div class="demo-line" id="srcLine"></div>
    <div id="explore"></div>
  </section>

  <!-- ============ MAP ============ -->
  <section class="view" id="v-map">
    <div class="maptools">
      <div class="seg" id="mapSeg"><button data-mm="map">🗺️ Map</button><button data-mm="list">☰ List</button></div>
      <button class="fbtn" data-act="filters">⚙️ Filters <i class="fCountM" hidden></i></button>
      <button class="btn line sm" data-act="area">Search this area</button>
      <button class="btn line sm" data-act="gps" aria-label="My location">📍</button>
      <span class="meta" id="mapCount"></span>
    </div>
    <div id="map"></div>
    <div id="mapList" class="grid" hidden></div>
  </section>

  <!-- ============ SAVED ============ -->
  <section class="view" id="v-saved">
    <h1 class="pagetitle">Saved</h1>
    <p class="sub">Places you want to try, and places you've been.</p>
    <div class="seg" id="savedSeg"><button data-sv="fav">♥ Favourites</button><button data-sv="visited">✓ Visited</button></div>
    <div id="savedList" style="margin-top:16px"></div>
  </section>

  <!-- ============ YOU ============ -->
  <section class="view" id="v-profile">
    <h1 class="pagetitle">You</h1>
    <p class="sub">Your tastes shape every recommendation. Saved on this device.</p>
    <div id="profile"></div>
  </section>
</main>

<nav class="bnav" aria-label="Main">
  <button data-tab="explore"><b>🧭</b>Explore</button>
  <button data-tab="map"><b>🗺️</b>Map</button>
  <button data-tab="saved"><b>❤️</b>Saved</button>
  <button data-tab="profile"><b>👤</b>You</button>
</nav>

<div class="onb" id="onb" role="dialog" aria-modal="true" aria-label="Welcome setup"></div>
<div class="backdrop" id="backdrop"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/providers/demo.js"></script>
<script src="assets/js/providers/osm.js"></script>
<script src="assets/js/providers/google.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/recommend.js"></script>
<script src="assets/js/planner.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
